name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Node 18
            os: ubuntu-latest
            node: 18
          - label: Ubuntu / Node 20
            os: ubuntu-latest
            node: 20
          - label: Ubuntu / Node 22
            os: ubuntu-latest
            node: 22
          - label: Windows / Node 20
            os: windows-latest
            node: 20
          - label: macOS / Node 20
            os: macos-latest
            node: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run repository checks
        run: npm run check

      - name: Build and install-smoke the release tarball
        run: npm run build:release
