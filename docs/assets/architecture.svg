<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenOne Workflow Kit dual-track architecture</title>
  <desc id="desc">A five-stage evidence flow connects local context, definition, execution, verification, and learning. Delivery and commercialization tracks share completion contracts, gates, and reusable knowledge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#FB7185"/>
    </marker>
  </defs>

  <rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1300" cy="100" r="320" fill="#F59E0B" fill-opacity="0.07"/>
  <circle cx="120" cy="850" r="300" fill="#FB7185" fill-opacity="0.06"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="78" fill="#F59E0B" font-size="18" font-weight="700" letter-spacing="1.6">DUAL-TRACK ARCHITECTURE</text>
    <text x="72" y="136" fill="#F8FAFC" font-size="48" font-weight="700" letter-spacing="-1.5">一套 Core，两条轨道，同一个证据闭环</text>
    <text x="72" y="176" fill="#A7B0C0" font-size="20">工具只是 adapter；本地事实、完成合同、Oracle 和复盘知识才是可迁移的核心。</text>

    <g transform="translate(72 230)">
      <text x="0" y="32" fill="#F59E0B" font-size="20" font-weight="700">研发轨 · DELIVERY</text>
      <text x="0" y="252" fill="#FB7185" font-size="20" font-weight="700">商业化轨 · GROWTH</text>

      <path d="M222 107H1190" fill="none" stroke="#F59E0B" stroke-opacity="0.64" stroke-width="3" marker-end="url(#arrowAmber)"/>
      <path d="M222 327H1190" fill="none" stroke="#FB7185" stroke-opacity="0.6" stroke-width="3" marker-end="url(#arrowCoral)"/>

      <g transform="translate(0 58)">
        <rect width="216" height="118" rx="22" fill="#121B2A" stroke="#A7B0C0" stroke-opacity="0.22"/>
        <text x="20" y="30" fill="#F59E0B" font-size="16" font-weight="700">01 · CONTEXT</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">本地事实与边界</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">team-profile · specs</text>
      </g>
      <g transform="translate(260 58)">
        <rect width="216" height="118" rx="22" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.48"/>
        <text x="20" y="30" fill="#F59E0B" font-size="16" font-weight="700">02 · DEFINE</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">需求与完成合同</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">PRD · architecture · Oracle</text>
      </g>
      <g transform="translate(520 58)">
        <rect width="216" height="118" rx="22" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.48"/>
        <text x="20" y="30" fill="#F59E0B" font-size="16" font-weight="700">03 · EXECUTE</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">交付至完成</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">implement · review · test</text>
      </g>
      <g transform="translate(780 58)">
        <rect width="216" height="118" rx="22" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.48"/>
        <text x="20" y="30" fill="#F59E0B" font-size="16" font-weight="700">04 · VERIFY</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">Blocking 全绿</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">evidence · release gate</text>
      </g>
      <g transform="translate(1040 58)">
        <rect width="216" height="118" rx="22" fill="#121B2A" stroke="#A7B0C0" stroke-opacity="0.22"/>
        <text x="20" y="30" fill="#F59E0B" font-size="16" font-weight="700">05 · LEARN</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">回写行为真相</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">specs · retrospective</text>
      </g>

      <g transform="translate(0 278)">
        <rect width="216" height="118" rx="22" fill="#121B2A" stroke="#A7B0C0" stroke-opacity="0.22"/>
        <text x="20" y="30" fill="#FB7185" font-size="16" font-weight="700">01 · CONTEXT</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">产品与市场证据</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">baseline · evidence grade</text>
      </g>
      <g transform="translate(260 278)">
        <rect width="216" height="118" rx="22" fill="#FB7185" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.45"/>
        <text x="20" y="30" fill="#FB7185" font-size="16" font-weight="700">02 · DEFINE</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">定位、PMF 与 ICP</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">value · model · journey</text>
      </g>
      <g transform="translate(520 278)">
        <rect width="216" height="118" rx="22" fill="#FB7185" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.45"/>
        <text x="20" y="30" fill="#FB7185" font-size="16" font-weight="700">03 · EXECUTE</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">渠道与预算策略</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">funnel · content · budget</text>
      </g>
      <g transform="translate(780 278)">
        <rect width="216" height="118" rx="22" fill="#FB7185" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.45"/>
        <text x="20" y="30" fill="#FB7185" font-size="16" font-weight="700">04 · VERIFY</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">衡量漏斗信号</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">CAC · conversion · signal</text>
      </g>
      <g transform="translate(1040 278)">
        <rect width="216" height="118" rx="22" fill="#121B2A" stroke="#A7B0C0" stroke-opacity="0.22"/>
        <text x="20" y="30" fill="#FB7185" font-size="16" font-weight="700">05 · LEARN</text>
        <text x="20" y="62" fill="#F8FAFC" font-size="21" font-weight="700">策略复盘</text>
        <text x="20" y="89" fill="#A7B0C0" font-size="16">scale · hold · cut</text>
      </g>

      <g transform="translate(0 454)">
        <rect width="1256" height="126" rx="26" fill="#101827" stroke="url(#accent)" stroke-opacity="0.76" stroke-width="2"/>
        <text x="28" y="38" fill="#F8FAFC" font-size="22" font-weight="700">Shared governance layer · 共享闸门</text>
        <text x="28" y="72" fill="#A7B0C0" font-size="18">完成合同 · Definition Lint · Acceptance Oracle · 分支/发布准入 · 证据分级 · 本地隐私边界</text>
        <text x="28" y="102" fill="#A7B0C0" font-size="17">workflow/core 保持工具无关；adapters 只负责把同一套决策接入当前 AI 工具。</text>
      </g>

      <g transform="translate(0 590)">
        <rect width="1256" height="68" rx="22" fill="url(#accent)" fill-opacity="0.13"/>
        <text x="628" y="43" fill="#F8FAFC" font-size="19" font-weight="700" text-anchor="middle">Local truth → explicit contract → evidence-backed delivery → reusable knowledge</text>
      </g>
    </g>
  </g>
</svg>
