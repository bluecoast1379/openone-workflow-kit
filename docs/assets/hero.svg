<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenOne Workflow Kit hero</title>
  <desc id="desc">OpenOne Workflow Kit is a dual-track research, delivery, and commercialization workflow for solo developers, built around completion contracts, acceptance oracles, and local-first adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientTransform="translate(1120 110) rotate(135) scale(560 520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientTransform="translate(1020 640) rotate(-125) scale(500 420)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#A7B0C0" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1440" height="720" rx="32" fill="url(#bg)"/>
  <rect width="1440" height="720" rx="32" fill="url(#grid)"/>
  <rect width="1440" height="720" rx="32" fill="url(#amberGlow)"/>
  <rect width="1440" height="720" rx="32" fill="url(#coralGlow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(90 84)">
      <rect width="318" height="42" rx="21" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.62"/>
      <circle cx="23" cy="21" r="5" fill="#F59E0B"/>
      <text x="40" y="28" fill="#F8FAFC" font-size="17" font-weight="600" letter-spacing="1.5">SOLO DEVELOPER WORKFLOW</text>
    </g>

    <text x="90" y="244" fill="#F8FAFC" font-size="84" font-weight="700" letter-spacing="-3">OpenOne</text>
    <text x="90" y="332" fill="url(#accent)" font-size="84" font-weight="700" letter-spacing="-3">Workflow Kit</text>
    <text x="94" y="396" fill="#D7DCE5" font-size="30" font-weight="500">独立开发者的研发 × 商业化双轨工作流</text>
    <text x="94" y="438" fill="#A7B0C0" font-size="22">先定义完成，再交付至可证明的完成。</text>

    <g transform="translate(90 510)" font-size="18" font-weight="600">
      <rect width="196" height="52" rx="26" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.55"/>
      <text x="98" y="33" fill="#F8FAFC" text-anchor="middle">Completion Contract</text>
      <rect x="214" width="170" height="52" rx="26" fill="#FB7185" fill-opacity="0.12" stroke="#FB7185" stroke-opacity="0.55"/>
      <text x="299" y="33" fill="#F8FAFC" text-anchor="middle">Dual Track</text>
      <rect x="402" width="156" height="52" rx="26" fill="#F8FAFC" fill-opacity="0.06" stroke="#A7B0C0" stroke-opacity="0.35"/>
      <text x="480" y="33" fill="#F8FAFC" text-anchor="middle">Local First</text>
    </g>

    <g transform="translate(796 112)" filter="url(#shadow)">
      <rect width="548" height="498" rx="30" fill="#101827" stroke="#A7B0C0" stroke-opacity="0.18"/>
      <text x="38" y="55" fill="#A7B0C0" font-size="17" font-weight="600" letter-spacing="1.4">ONE CORE · TWO TRACKS · SHARED GATES</text>

      <g transform="translate(38 92)">
        <rect width="472" height="140" rx="24" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.45"/>
        <circle cx="40" cy="42" r="17" fill="#F59E0B"/>
        <path d="M32 42h16M40 34v16" stroke="#070B14" stroke-width="3" stroke-linecap="round"/>
        <text x="72" y="49" fill="#F8FAFC" font-size="26" font-weight="700">研发轨 Delivery</text>
        <text x="40" y="91" fill="#D7DCE5" font-size="19">需求 → 完成合同 → 实现 → Oracle 验证</text>
        <text x="40" y="120" fill="#A7B0C0" font-size="17">Definition-to-Done，不用“感觉完成”代替证据。</text>
      </g>

      <g transform="translate(38 252)">
        <rect width="472" height="140" rx="24" fill="#FB7185" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.42"/>
        <circle cx="40" cy="42" r="17" fill="#FB7185"/>
        <path d="M32 46l7-8 6 5 7-9" fill="none" stroke="#070B14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="72" y="49" fill="#F8FAFC" font-size="26" font-weight="700">商业化轨 Growth</text>
        <text x="40" y="91" fill="#D7DCE5" font-size="19">定位 → PMF / ICP → 渠道 → 预算 → 复盘</text>
        <text x="40" y="120" fill="#A7B0C0" font-size="17">让产品决策、交付和增长信号在同一个闭环。</text>
      </g>

      <g transform="translate(38 420)">
        <path d="M0 0H472" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
        <text x="0" y="38" fill="#F8FAFC" font-size="18" font-weight="600">Claude · Codex · Cursor · Copilot · CodeBuddy · Kiro · Trae</text>
      </g>
    </g>
  </g>
</svg>
