<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">OpenOne Workflow Kit 社交预览</title>
  <desc id="desc">OpenOne 是面向独立开发者的研发与商业化工作流，小改动少走流程，高风险工作完整检查。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 110) rotate(135) scale(520 460)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#A7B0C0" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="1110" cy="590" r="270" fill="#FB7185" fill-opacity="0.08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(72 70)">
      <rect width="500" height="56" rx="28" fill="#F59E0B" fill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.58"/>
      <circle cx="28" cy="28" r="7" fill="#F59E0B"/>
      <text x="50" y="38" fill="#F8FAFC" font-size="28" font-weight="700" letter-spacing="1.2">独立开发者工作流</text>
    </g>

    <text x="72" y="216" fill="#F8FAFC" font-size="78" font-weight="700" letter-spacing="-3">OpenOne</text>
    <text x="72" y="298" fill="url(#accent)" font-size="78" font-weight="700" letter-spacing="-3">Workflow Kit</text>
    <text x="76" y="360" fill="#D7DCE5" font-size="29" font-weight="500">独立开发者的研发 × 商业化双轨工作流</text>
    <text x="76" y="404" fill="#A7B0C0" font-size="28">完成标准 · 风险自适应 · 本地优先</text>

    <g transform="translate(76 458)">
      <rect width="540" height="94" rx="24" fill="#F59E0B" fill-opacity="0.09" stroke="#F59E0B" stroke-opacity="0.4"/>
      <circle cx="34" cy="47" r="16" fill="#F59E0B"/>
      <text x="64" y="38" fill="#F8FAFC" font-size="28" font-weight="700">研发工作</text>
      <text x="64" y="74" fill="#A7B0C0" font-size="28">明确 → 修改 → 检查 → 发布</text>
    </g>
    <g transform="translate(636 458)">
      <rect width="540" height="94" rx="24" fill="#FB7185" fill-opacity="0.08" stroke="#FB7185" stroke-opacity="0.4"/>
      <circle cx="34" cy="47" r="16" fill="#FB7185"/>
      <text x="64" y="38" fill="#F8FAFC" font-size="28" font-weight="700">商业化工作</text>
      <text x="64" y="74" fill="#A7B0C0" font-size="28">定位 → 获客 → 衡量 → 调整</text>
    </g>

    <g transform="translate(1048 74)">
      <circle cx="72" cy="72" r="72" fill="#101827" stroke="url(#accent)" stroke-width="3"/>
      <path d="M77 34 47 82h26l-8 30 34-48H73Z" fill="url(#accent)"/>
    </g>
  </g>
</svg>
