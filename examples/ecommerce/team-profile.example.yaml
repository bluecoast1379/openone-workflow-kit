schema_version: "1.0"
generated_at: "2026-06-05T00:00:00.000Z"
generated_by: "agent-workflow-init (ecommerce example)"

# Example profile for an ecommerce team that runs both a customer-facing
# storefront and a backoffice for merchants. Replace placeholders before use.

team:
  name: "Example Storefront Team"
  business_definition: "Direct-to-consumer storefront and merchant backoffice."
  target_users:
    - "shopper"
    - "merchant operator"
    - "fulfillment partner"

industries:
  - ecommerce

enabled_tools:
  - codex
  - claude
  - cursor
  - copilot

detected_tools: []

source_materials:
  business_intro:
    label: "业务介绍"
    status: "provided_by_user"
    paths:
      - "docs/product/overview.md"
  project_docs:
    label: "项目资料"
    status: "provided_by_user"
    paths:
      - "docs/product/"
      - "docs/merchant-runbook.md"
  ui_specs:
    label: "UI 设计文件"
    status: "provided_by_user"
    paths:
      - "docs/design/storefront-tokens.md"
      - "docs/design/backoffice-tokens.md"
  frontend_rules:
    label: "前端开发规范"
    status: "provided_by_user"
    paths:
      - "docs/frontend-rules.md"
  backend_rules:
    label: "后端开发规范"
    status: "provided_by_user"
    paths:
      - "docs/backend-rules.md"
  testing_rules:
    label: "测试规范"
    status: "provided_by_user"
    paths:
      - "docs/testing-rules.md"

repos:
  - path: "apps/storefront"
    marker: "node"
    tech_stack:
      - "node"
      - "react"
      - "next"
      - "typescript"
    family: "frontend-web"
    role: "customer storefront"
  - path: "apps/backoffice"
    marker: "node"
    tech_stack:
      - "node"
      - "vue"
      - "typescript"
    family: "frontend-web"
    role: "merchant backoffice"
  - path: "services/catalog"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "catalog and search"
  - path: "services/orders"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "order lifecycle"
  - path: "services/payments"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "payment integration"

branch_model:
  type: "gitflow"
  production_branch: "main"
  integration_branch: "develop"
  feature_branch_rule: "feature/{ticket}-{slug}"
  worktree_dir: "_worktrees"

risk_policy:
  local_git_operations: "agent-allowed-after-scope-check"
  branch_creation: "agent-allowed-after-scope-check"
  remote_git_operations: "explicit-user-authorization-required"
  push_and_release: "explicit-user-authorization-required"
  database_writes: "explicit-user-authorization-required"
  production_config_writes: "explicit-user-authorization-required"
  local_project_config_writes: "agent-allowed-after-scope-check"
  high_risk_detection: "use workflow/policy.yaml and workflow/core/tools/resolve-policy.cjs"

workflow:
  policy: "workflow/policy.yaml"
  features_dir: "features"
  business_dir: "business"
  specs_dir: "specs"
  standards_dir: "workflow/standards"
  constitution: "workflow/constitution.md"
  core_dir: "workflow/core"
  adapters_dir: "workflow/adapters"
  processing_profile_source: "workflow/policy.yaml"
  user_facing_profiles: "自动选择 / 完整检查；低风险时为轻量处理"
  completion_language: "完成标准 / 验收项 / 检查结果 / 明确卡点"
  same_repo_parallel_policy: "use an isolated worktree only for real concurrent implementation"

# Ecommerce teams should prioritize release safety, contract tracing
# (between catalog/orders/payments), and UI baseline review for the storefront.
enabled_capabilities:
  - branch-gatekeeper
  - release-safety-checker
  - prd-code-diff-checker
  - contract-tracer
  - ui-baseline-reviewer
  - security-reviewer
  - test-evidence-reviewer
