schema_version: "1.0"
generated_at: "2026-06-05T00:00:00.000Z"
generated_by: "agent-workflow-init (education example)"

# Example profile for a learning platform team that runs a learner-facing
# web app, an instructor console, and backend services. Replace placeholders
# before use; do not commit real learner, instructor, school, or billing data.

team:
  name: "Example Learning Platform"
  business_definition: "Learning platform for course delivery, assessments, and instructor operations."
  target_users:
    - "learner"
    - "instructor"
    - "school admin"
    - "support operator"

industries:
  - education

enabled_tools:
  - codex
  - claude
  - cursor

detected_tools: []

source_materials:
  business_intro:
    label: "业务介绍"
    status: "provided_by_user"
    paths:
      - "docs/product/overview.md"
  project_docs:
    label: "项目资料"
    status: "provided_by_user"
    paths:
      - "docs/product/"
      - "docs/learning-content/"
  ui_specs:
    label: "UI 设计文件"
    status: "provided_by_user"
    paths:
      - "docs/design/learner-tokens.md"
      - "docs/design/instructor-tokens.md"
  frontend_rules:
    label: "前端开发规范"
    status: "provided_by_user"
    paths:
      - "docs/frontend-rules.md"
  backend_rules:
    label: "后端开发规范"
    status: "provided_by_user"
    paths:
      - "docs/backend-rules.md"
  testing_rules:
    label: "测试规范"
    status: "provided_by_user"
    paths:
      - "docs/testing-rules.md"

repos:
  - path: "apps/learner-web"
    marker: "node"
    tech_stack:
      - "node"
      - "react"
      - "typescript"
    family: "frontend-web"
    role: "learner-facing web app"
  - path: "apps/instructor-console"
    marker: "node"
    tech_stack:
      - "node"
      - "vue"
      - "typescript"
    family: "frontend-web"
    role: "instructor operations console"
  - path: "services/course"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "course catalog and enrollment"
  - path: "services/assessment"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "quiz and assessment workflow"
  - path: "services/notification"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "email and in-app notifications"

branch_model:
  type: "trunk-based"
  production_branch: "main"
  integration_branch: "main"
  feature_branch_rule: "feature/{ticket}-{slug}"
  worktree_dir: "_worktrees"

risk_policy:
  local_git_operations: "agent-allowed-after-scope-check"
  branch_creation: "agent-allowed-after-scope-check"
  remote_git_operations: "explicit-user-authorization-required"
  push_and_release: "explicit-user-authorization-required"
  database_writes: "explicit-user-authorization-required"
  production_config_writes: "explicit-user-authorization-required"
  local_project_config_writes: "agent-allowed-after-scope-check"
  high_risk_detection: "use workflow/policy.yaml and workflow/core/tools/resolve-policy.cjs"

workflow:
  policy: "workflow/policy.yaml"
  features_dir: "features"
  business_dir: "business"
  specs_dir: "specs"
  standards_dir: "workflow/standards"
  constitution: "workflow/constitution.md"
  core_dir: "workflow/core"
  adapters_dir: "workflow/adapters"
  processing_profile_source: "workflow/policy.yaml"
  user_facing_profiles: "自动选择 / 完整检查；低风险时为轻量处理"
  completion_language: "完成标准 / 验收项 / 检查结果 / 明确卡点"
  same_repo_parallel_policy: "use an isolated worktree only for real concurrent implementation"

# Learning platforms should prioritize contract tracing for course and
# assessment flows, privacy review for learner data, and evidence-based
# verification of learner and instructor journeys.
enabled_capabilities:
  - branch-gatekeeper
  - release-safety-checker
  - prd-code-diff-checker
  - contract-tracer
  - ui-baseline-reviewer
  - security-reviewer
  - test-evidence-reviewer
  - verify-app
