  project_docs:
    label: "项目资料"
    status: "provided_by_user"
    paths:
      - "docs/product/"
  ui_specs:
    label: "UI 设计文件"
    status: "provided_by_user"
    paths:
      - "docs/design/tokens.md"
      - "docs/design/components.md"
  frontend_rules:
    label: "前端开发规范"
    status: "provided_by_user"
    paths:
      - "docs/frontend-rules.md"
  backend_rules:
    label: "后端开发规范"
    status: "provided_by_user"
    paths:
      - "docs/backend-rules.md"
  testing_rules:
    label: "测试规范"
    status: "provided_by_user"
    paths:
      - "docs/testing-rules.md"

repos:
  - path: "apps/web"
    marker: "node"
    tech_stack:
      - "node"
      - "react"
      - "typescript"
      - "vite"
    family: "frontend-web"
    role: "tenant-facing web app"
  - path: "apps/admin"
    marker: "node"
    tech_stack:
      - "node"
      - "react"
      - "typescript"
    family: "frontend-web"
    role: "internal admin console"
  - path: "services/api"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
      - "fastify"
    family: "backend-api"
    role: "tenant-facing API gateway"
  - path: "services/billing"
    marker: "node"
    tech_stack:
      - "node"
      - "typescript"
    family: "backend-service"
    role: "subscription billing"

branch_model:
  type: "trunk-based"
  production_branch: "main"
  integration_branch: "main"
  feature_branch_rule: "feature/{ticket}-{slug}"
  worktree_dir: "_worktrees"

risk_policy:
  local_git_operations: "agent-allowed-after-scope-check"
  branch_creation: "agent-allowed-after-scope-check"
  remote_git_operations: "explicit-user-authorization-required"
  push_and_release: "explicit-user-authorization-required"
  database_writes: "explicit-user-authorization-required"
  production_config_writes: "explicit-user-authorization-required"
  local_project_config_writes: "agent-allowed-after-scope-check"
  high_risk_detection: "use workflow/policy.yaml and workflow/core/tools/resolve-policy.cjs"

workflow:
  policy: "workflow/policy.yaml"
  features_dir: "features"
  business_dir: "business"
  specs_dir: "specs"
  standards_dir: "workflow/standards"
  constitution: "workflow/constitution.md"
  core_dir: "workflow/core"
  adapters_dir: "workflow/adapters"
  processing_profile_source: "workflow/policy.yaml"
  user_facing_profiles: "自动选择 / 完整检查；低风险时为轻量处理"
  completion_language: "完成标准 / 验收项 / 检查结果 / 明确卡点"
  same_repo_parallel_policy: "use an isolated worktree only for real concurrent implementation"

# Recommended capabilities to adopt first for a SaaS to B product.
enabled_capabilities:
  - branch-gatekeeper
  - release-safety-checker
  - prd-code-diff-checker
  - contract-tracer
  - security-reviewer
