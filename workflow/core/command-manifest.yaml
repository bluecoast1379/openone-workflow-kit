schema_version: "1.1"
command_count: 32
commands:
  - id: "init-workspace"
    skill_slug: "workflow-init-workspace"
    title: "初始化工作区"
    description: "扫描本地资料、生成 team-profile、缺资料提问，并生成当前工具 adapter。"
    user_title: "准备工作区"
    user_description: "识别项目和现有资料，准备后续协作所需的工作区设置。"
    argument_hint: "<目标目录>"
    implementation_gate: false
  - id: "new-feature"
    skill_slug: "workflow-new-feature"
    title: "初始化功能工作流"
    description: "创建 features/{feature}/ 容器、状态文件和截图目录，并完成 S/M/L 复杂度分级。"
    user_title: "开始一个改动"
    user_description: "记录这次要改什么，并根据影响范围选择合适的处理方式。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "01-需求讨论"
    skill_slug: "workflow-01-requirement-discussion"
    title: "需求讨论"
    description: "澄清业务目标、边界、验收口径和待确认项。"
    user_title: "讨论需求"
    user_description: "说清目标、范围、完成条件和仍需确认的问题。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "澄清"
    skill_slug: "workflow-clarification"
    title: "澄清"
    description: "每轮不超过 5 个针对性问题消融语义歧义，答案写回文档并清理待澄清标记。"
    user_title: "补充关键信息"
    user_description: "集中询问会影响结果的少量问题，并把答案整理回现有资料。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "02-产品文档"
    skill_slug: "workflow-02-product-document"
    title: "产品文档"
    description: "输出 PRD、业务规则、高层 UI 方向、非功能需求和验收口径。"
    user_title: "整理产品方案"
    user_description: "把需求整理成可执行的产品说明、业务规则和完成条件。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "02B-UI设计"
    skill_slug: "workflow-02b-ui-design"
    title: "UI 设计"
    description: "在产品文档后输出可被实现遵循的信息架构、关键流程、页面清单、组件规范、平台适配、可访问性和 04A 交接规范。"
    user_title: "明确界面方案"
    user_description: "确定页面结构、操作过程、组件规则和不同设备上的表现。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "03-技术架构"
    skill_slug: "workflow-03-technical-architecture"
    title: "技术架构"
    description: "识别项目族、影响仓库、调用链、分支基线和实现准入风险。"
    user_title: "评估技术方案"
    user_description: "确认会影响哪些项目和调用关系，并找出实施前需要处理的风险。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "03-06-研发准备"
    skill_slug: "workflow-03-06-rd-readiness"
    title: "研发准备编排"
    description: "在已有 PRD 和必要的 02B UI 设计基线后串联生成 03 到 06 的研发准备文档；不授权代码实现。"
    user_title: "准备开发资料"
    user_description: "根据现有产品和界面方案，一次整理技术方案、检查重点与开发准备。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "04-代码实现"
    skill_slug: "workflow-04-code-implementation"
    title: "代码实现总览"
    description: "在准入通过后记录后端、前端、配置、数据和发布影响的真实改动。"
    user_title: "开始修改"
    user_description: "按照已经明确的范围修改代码和配置，并记录实际影响。"
    argument_hint: "<功能名称>"
    implementation_gate: true
  - id: "04A-前端代码实现"
    skill_slug: "workflow-04a-frontend-implementation"
    title: "前端代码实现"
    description: "记录页面、组件、接口、状态、回显和前端验证。"
    user_title: "修改界面"
    user_description: "实现页面和交互改动，并检查界面状态与数据展示。"
    argument_hint: "<功能名称>"
    implementation_gate: true
  - id: "04B-后端代码实现"
    skill_slug: "workflow-04b-backend-implementation"
    title: "后端代码实现"
    description: "记录接口、服务、数据、事务、消息、配置和后端验证。"
    user_title: "修改服务端"
    user_description: "实现接口、服务和数据相关改动，并检查关键处理结果。"
    argument_hint: "<功能名称>"
    implementation_gate: true
  - id: "05-代码审查"
    skill_slug: "workflow-05-code-review"
    title: "代码审查"
    description: "以问题优先方式审查真实 diff、发布边界、PRD 一致性和残余风险。"
    user_title: "检查代码改动"
    user_description: "查看真实改动，优先指出错误、遗漏和仍需注意的风险。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "06-测试用例"
    skill_slug: "workflow-06-test-cases"
    title: "测试用例"
    description: "以风险驱动方式输出覆盖矩阵，每条用例可绑定为完成合同的验收 Oracle。"
    user_title: "准备检查清单"
    user_description: "根据风险列出需要验证的行为、边界情况和检查方法。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "定义完成"
    skill_slug: "workflow-define-done"
    title: "定义完成"
    description: "把 01-06 结论编译成完成合同，通过 Definition Lint 后经用户确认冻结。"
    user_title: "确认完成标准"
    user_description: "汇总目标、范围和验收项，确认怎样才算真正完成。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "一致性检查"
    skill_slug: "workflow-consistency-check"
    title: "一致性检查"
    description: "实现前对合同与各阶段文档做只读交叉检查，逮住冲突、漂移和覆盖缺口。"
    user_title: "开工前检查"
    user_description: "在修改前核对现有资料，找出互相矛盾、已经变化或遗漏的内容。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "交付至完成"
    skill_slug: "workflow-deliver-until-done"
    title: "交付至完成"
    description: "合同冻结后在范围内自主循环实现-验证-修复，直到 blocking Oracle 全绿或精确阻塞。"
    user_title: "完成这次改动"
    user_description: "在约定范围内完成修改、验证和必要修复，直到可以交付或遇到明确卡点。"
    argument_hint: "<功能名称>"
    implementation_gate: true
  - id: "07-测试执行"
    skill_slug: "workflow-07-test-execution"
    title: "测试执行"
    description: "记录真实执行结果与证据，翻转完成合同的 Oracle 状态。"
    user_title: "验证改动"
    user_description: "执行合适的检查并记录真实结果，确认改动是否符合完成标准。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "08-发布准备"
    skill_slug: "workflow-08-release-preparation"
    title: "发布准备"
    description: "完成个人项目的本地集成、版本号、tag、发布清单、回滚点和渠道材料。"
    user_title: "准备发布"
    user_description: "整理版本、发布清单、恢复方案和需要的发布材料。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "09-发布执行"
    skill_slug: "workflow-09-release-execution"
    title: "发布执行"
    description: "在用户明确授权后执行远程 push、release、商店/平台发布或部署，并记录证据。"
    user_title: "执行发布"
    user_description: "获得明确同意后执行对外发布或部署，并记录实际结果。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "10-复盘总结"
    skill_slug: "workflow-10-retrospective"
    title: "复盘总结"
    description: "沉淀项目结论、可复用规则、知识库更新和下一轮改进项。"
    user_title: "总结这次工作"
    user_description: "整理结果、经验、可复用规则和下一次可以改进的地方。"
    argument_hint: "<功能名称>"
    implementation_gate: false
  - id: "new-product"
    skill_slug: "workflow-new-product"
    title: "初始化商业化工作流"
    description: "创建 business/{product}/ 容器、商业化状态文件和素材目录。"
    user_title: "开始商业规划"
    user_description: "为一个产品建立商业规划记录，并准备后续分析所需资料。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B1-业务定位"
    skill_slug: "workflow-b1-positioning"
    title: "业务定位"
    description: "基于产品服务盘点、市场调研和竞争对手分析形成定位陈述与细分选择。"
    user_title: "明确产品定位"
    user_description: "结合产品、市场和竞争情况，说明为谁解决什么问题。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B1-B8-商业化准备"
    skill_slug: "workflow-b1-b8-commercial-readiness"
    title: "商业化准备编排"
    description: "在容器初始化后串联生成 B1 到 B8 的商业化文档；不授权对外投放。"
    user_title: "准备商业方案"
    user_description: "一次整理产品定位、客户、渠道、获客计划和预算等商业准备。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B2-商业模式"
    skill_slug: "workflow-b2-business-model"
    title: "商业模式"
    description: "梳理价值主张、收入与定价假设、成本结构、单位经济和关键假设。"
    user_title: "设计商业模式"
    user_description: "说明产品如何创造价值和获得收入，并记录成本与关键假设。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B3-PMF与客户画像"
    skill_slug: "workflow-b3-pmf-customer-profile"
    title: "PMF 与客户画像"
    description: "验证产品市场匹配度，确定理想客户画像 ICP 和负面画像。"
    user_title: "明确目标客户"
    user_description: "判断产品是否符合市场需要，并描述最适合与不适合的客户。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B4-场景与购买旅程"
    skill_slug: "workflow-b4-scenarios-buying-journey"
    title: "场景与购买旅程"
    description: "深挖客户使用场景（JTBD）和付费购买旅程、异议与流失点。"
    user_title: "梳理使用与购买过程"
    user_description: "了解客户在什么情况下使用和购买，以及可能犹豫或离开的原因。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B5-渠道漏斗映射"
    skill_slug: "workflow-b5-channel-funnel"
    title: "渠道漏斗映射"
    description: "明确线上线下各渠道在转化漏斗中的位置、作用、成本和 ICP 匹配度。"
    user_title: "选择获客渠道"
    user_description: "比较各类渠道的作用、成本和目标客户匹配程度。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B6-营销获客策略"
    skill_slug: "workflow-b6-acquisition-strategy"
    title: "营销获客策略"
    description: "制定总体营销/获客策略：阶段目标、主攻渠道、信息一致性和内容支柱。"
    user_title: "制定获客方案"
    user_description: "确定阶段目标、重点渠道、对外表达和主要内容方向。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B7-营销预算"
    skill_slug: "workflow-b7-marketing-budget"
    title: "营销预算"
    description: "确定金钱与时间双预算、渠道分配、CAC 目标和止损线。"
    user_title: "安排营销预算"
    user_description: "分配金钱和时间，设定成本目标以及何时停止投入。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B8-渠道执行策略"
    skill_slug: "workflow-b8-channel-execution"
    title: "渠道执行策略"
    description: "制定 SEO 及其他已选渠道的执行 playbook，并把营销工程需求回流研发轨。"
    user_title: "制定渠道执行计划"
    user_description: "把选定渠道拆成具体行动，并记录需要产品或开发配合的事项。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "B9-策略复盘"
    skill_slug: "workflow-b9-strategy-review"
    title: "策略复盘"
    description: "按周期复盘漏斗数据、渠道 ROI 和假设判定，输出渠道加码/保持/降配/砍掉决策。"
    user_title: "复盘商业策略"
    user_description: "根据实际数据判断哪些做法继续、调整或停止。"
    argument_hint: "<产品名称>"
    implementation_gate: false
  - id: "workflow-status"
    skill_slug: "workflow-status"
    title: "工作流状态"
    description: "汇总 features 与 business 下所有需求和产品的阶段状态、阻塞和下一步。"
    user_title: "查看进度"
    user_description: "汇总当前改动和商业规划的进展、卡点与待办事项。"
    argument_hint: "[功能名称或产品名称]"
    implementation_gate: false
